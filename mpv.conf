###########################################################################
# Plex HTPC - mpv.conf
# Baseline configuration for plex-profile-manager.lua
#
# Installation: %LOCALAPPDATA%\Plex HTPC\mpv.conf
#
# The Lua script dynamically overrides scaling, deband, and shader
# settings based on detected content type. This file sets the baseline.
###########################################################################

#########
#  GPU  #
#########

# Uncomment to enable logging (useful for debugging the profile manager)
# log-file=~~/mpv-log.txt

gpu-api=auto
vo=gpu-next
profile=high-quality

#########
# Cache #
#########

gpu-shader-cache-dir=~~/cache/shaders
icc-cache-dir=~~/cache/icc

#############
# Colorspace #
#############

target-prim=auto
target-trc=auto
target-contrast=auto

###############
# Scaling     #
# (overridden by profile-manager.lua per content type)
###############

scale=spline36
cscale=lanczos
dscale=mitchell
scale-antiring=0.7
cscale-antiring=0.7
dscale-antiring=0.7
sigmoid-upscaling=yes
linear-downscaling=no
correct-downscaling=yes

###############
# Debanding   #
# (overridden by profile-manager.lua per content type)
###############

deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=0

#########
# Audio #
#########

# Wait for audio device to be ready before starting playback.
# Helps with WASAPI exclusive mode + AVR handshake delays on first launch.
# Increase to 2-3 if you still get audio dropouts on first play.
audio-wait-open=1

# Larger audio buffer gives the eARC/ARC handshake more time to settle.
# Default is ~0.2s; 0.4s adds safety margin without noticeable latency.
audio-buffer=0.4

# Keep the WASAPI exclusive session alive by sending silence between files
# and during pause. Prevents eARC renegotiation when navigating Plex menus
# or switching episodes. Acts like SoundKeeper but only for Plex.
audio-stream-silence=yes

############
# Dithering #
############

dither=fruit
dither-depth=10
temporal-dither=yes
temporal-dither-period=1

#########
#  OSD  #
#########

osd-font-size=36
osd-bar=no
osd-duration=3000
